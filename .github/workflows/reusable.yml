name: reusable
on:
  workflow_call:
jobs:
  called:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: .github/scripts/claims.sh "${{ github.event_name }}-reusable"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.event_name }}-reusable", path: claims }
